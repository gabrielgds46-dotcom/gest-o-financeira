<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Touca e franja são a PRÓPRIA cabeça recortada no topo: encaixam
         perfeitamente, em vez de um arco desenhado por cima que nunca casa. -->
    <clipPath id="toucaEsq"><rect x="196" y="330" width="268" height="130"/></clipPath>
    <clipPath id="franjaDir"><rect x="572" y="330" width="268" height="122"/></clipPath>
    <clipPath id="quadro"><rect width="1024" height="1024"/></clipPath>

    <g id="loc">
      <rect x="-17" y="0" width="34" height="242" rx="17" fill="#6E6E6E"/>
      <g fill="#3D3D3D">
        <rect x="-17" y="32" width="34" height="11"/><rect x="-17" y="74" width="34" height="11"/>
        <rect x="-17" y="116" width="34" height="11"/><rect x="-17" y="158" width="34" height="11"/>
        <rect x="-17" y="200" width="34" height="11"/>
      </g>
    </g>
  </defs>

  <g clip-path="url(#quadro)">
    <rect width="1024" height="1024" fill="#1C9268"/>

    <!-- ---------- seta de crescimento ---------- -->
    <path d="M150 336 L316 236 L470 290 L744 160"
          fill="none" stroke="#F5C97A" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M702 146 L818 156 L762 254 Z" fill="#F5C97A"/>

    <!-- ---------- coração ---------- -->
    <path d="M512 400c-23-29-62-21-62 10 0 27 39 48 62 66 23-18 62-39 62-66 0-31-39-39-62-10z"
          fill="#F08A72"/>

    <!-- ---------- corpos: largos, para as cabeças não flutuarem ---------- -->
    <path d="M512 1024V600c-166 0-300 134-300 300v124z" fill="#EFA326"/>
    <path d="M512 1024V600c166 0 300 134 300 300v124z" fill="#8C8C8C"/>

    <!-- ================= pessoa da esquerda ================= -->
    <g>
      <use href="#loc" x="216" y="432"/>
      <use href="#loc" x="256" y="462"/>
      <use href="#loc" x="396" y="462"/>
      <use href="#loc" x="436" y="432"/>
    </g>
    <rect x="296" y="552" width="60" height="70" fill="#8A5426"/>
    <circle cx="326" cy="462" r="120" fill="#8A5426"/>
    <circle cx="326" cy="462" r="120" fill="#141414" clip-path="url(#toucaEsq)"/>
    <g stroke="#4A4A4A" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M266 398q16-34 46-48"/><path d="M326 340v10"/><path d="M386 398q-16-34-46-48"/>
    </g>
    <circle cx="288" cy="490" r="15" fill="#141414"/>
    <circle cx="368" cy="490" r="15" fill="#141414"/>
    <path d="M284 534q42 38 84 0" stroke="#141414" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- ================= pessoa da direita ================= -->
    <path d="M576 466a122 122 0 0 1 244 0v182q0 36 14 62h-272q14-26 14-62z" fill="#141414"/>
    <rect x="668" y="552" width="60" height="70" fill="#F3DCC4"/>
    <circle cx="698" cy="462" r="114" fill="#F3DCC4"/>
    <circle cx="698" cy="462" r="114" fill="#141414" clip-path="url(#franjaDir)"/>
    <circle cx="634" cy="544" r="24" fill="#F0A8A0"/>
    <circle cx="762" cy="544" r="24" fill="#F0A8A0"/>
    <g stroke="#141414" stroke-width="10" fill="none">
      <circle cx="660" cy="488" r="41"/>
      <circle cx="754" cy="488" r="41"/>
      <path d="M701 488h12" stroke-linecap="round"/>
    </g>
    <circle cx="660" cy="488" r="15" fill="#141414"/>
    <circle cx="754" cy="488" r="15" fill="#141414"/>
    <path d="M660 550q47 40 94 0" stroke="#141414" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- ================= dinheiro ================= -->
    <circle cx="762" cy="852" r="94" fill="#F0C070" stroke="#9A6B1E" stroke-width="16"/>
    <text x="762" y="896" font-family="Georgia, 'Times New Roman', serif" font-size="118"
          font-weight="bold" fill="#9A6B1E" text-anchor="middle">$</text>
    <g stroke="#9A6B1E" stroke-width="13">
      <ellipse cx="308" cy="898" rx="88" ry="27" fill="#F0C070"/>
      <ellipse cx="308" cy="854" rx="88" ry="27" fill="#F5D089"/>
      <ellipse cx="308" cy="810" rx="88" ry="27" fill="#F5D089"/>
    </g>
    <rect x="370" y="804" width="300" height="142" rx="22"
          fill="#B8E08A" stroke="#2C5E10" stroke-width="17"/>
    <circle cx="520" cy="875" r="36" fill="none" stroke="#2C5E10" stroke-width="17"/>
  </g>
</svg>

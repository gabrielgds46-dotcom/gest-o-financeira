<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- =============================================================
       Ícone para tela de início: quatro formas que importam, e só.
       Duas cabeças grandes, o coração no vão entre elas, e o dinheiro
       como UM bloco embaixo. Tudo dentro do círculo de segurança
       (raio 410 a partir do centro), então o recorte do Android come
       só o verde.
       ============================================================= -->
  <defs>
    <clipPath id="toucaE"><rect x="130" y="230" width="410" height="190"/></clipPath>
    <clipPath id="franjaD"><rect x="486" y="230" width="410" height="180"/></clipPath>
    <!-- Tranças sem os entalhes: a 48px o detalhe vira ruído. -->
    <g id="loc3"><rect x="-24" y="0" width="48" height="250" rx="24" fill="#5E5E5E"/></g>
  </defs>

  <rect width="1024" height="1024" fill="#1C9268"/>

  <!-- ============ esquerda ============ -->
  <g>
    <use href="#loc3" x="172" y="396"/>
    <use href="#loc3" x="226" y="434"/>
    <use href="#loc3" x="414" y="434"/>
    <use href="#loc3" x="468" y="396"/>
  </g>
  <circle cx="320" cy="430" r="172" fill="#8A5426"/>
  <circle cx="320" cy="430" r="172" fill="#141414" clip-path="url(#toucaE)"/>
  <circle cx="266" cy="468" r="24" fill="#141414"/>
  <circle cx="374" cy="468" r="24" fill="#141414"/>
  <path d="M262 530q58 56 116 0" stroke="#141414" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- ============ direita ============ -->
  <path d="M534 436a170 170 0 0 1 340 0v140q0 30 13 52h-366q13-22 13-52z" fill="#141414"/>
  <circle cx="704" cy="430" r="164" fill="#F3DCC4"/>
  <circle cx="704" cy="430" r="164" fill="#141414" clip-path="url(#franjaD)"/>
  <circle cx="614" cy="520" r="32" fill="#F0A8A0"/>
  <circle cx="794" cy="520" r="32" fill="#F0A8A0"/>
  <g stroke="#141414" stroke-width="17" fill="none">
    <circle cx="648" cy="466" r="58"/><circle cx="760" cy="466" r="58"/>
    <path d="M708 466h-8" stroke-linecap="round"/>
  </g>
  <circle cx="648" cy="466" r="24" fill="#141414"/>
  <circle cx="760" cy="466" r="24" fill="#141414"/>
  <path d="M646 538q58 56 116 0" stroke="#141414" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- ============ dinheiro: um bloco só ============ -->
  <rect x="180" y="716" width="470" height="216" rx="34"
        fill="#B8E08A" stroke="#2C5E10" stroke-width="26"/>
  <circle cx="404" cy="824" r="56" fill="none" stroke="#2C5E10" stroke-width="26"/>
  <circle cx="726" cy="824" r="146" fill="#F0C070" stroke="#9A6B1E" stroke-width="26"/>
  <text x="726" y="890" font-family="Georgia, 'Times New Roman', serif" font-size="188"
        font-weight="bold" fill="#9A6B1E" text-anchor="middle">$</text>

  <!-- Coração por último, no vão entre as cabeças: desenhado depois de
       tudo, nenhum cabelo passa por cima dele. -->
  <path d="M512 214c-38-48-100-33-100 17 0 44 62 77 100 106 38-29 100-62 100-106 0-50-62-65-100-17z"
        fill="#F08A72"/>
</svg>
